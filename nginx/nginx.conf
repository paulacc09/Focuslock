events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # ==============================================================================
    # FOCUSLOCK — UPSTREAM LOAD BALANCER CON STICKY SESSIONS & WEBSOCKETS
    # ==============================================================================
    upstream focuslock_backend {
        # Sticky sessions basado en IP de cliente para mantener afinidad de WebSocket
        ip_hash;

        # Réplica 1
        server focuslock_server_1:8000 max_fails=3 fail_timeout=10s;
        # Réplica 2
        server focuslock_server_2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost digiproy.qd.je;

        # Logs
        access_log /var/log/nginx/focuslock_access.log;
        error_log /var/log/nginx/focuslock_error.log warn;

        # Encabezados de Seguridad
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # Proxy general hacia el upstream balanceado
        location / {
            proxy_pass http://focuslock_backend;
            proxy_http_version 1.1;

            # Cabeceras requeridas para soporte nativo de WebSockets
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Encabezados estándar de proxy inverso
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts extendidos para conexiones persistentes de WebSockets
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Healthcheck endpoint
        location /healthz {
            proxy_pass http://focuslock_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
