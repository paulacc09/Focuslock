<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFE 2 — Cámara & Micrófono en Vivo</title>
  <style>
    :root {
      --bg: #F5F9F8;
      --card: #FFFFFF;
      --border: #E2EAE7;
      --sage: #7EAE9B;
      --sage-dark: #659683;
      --text: #192A24;
      --text-sec: #526B61;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: transparent;
      color: var(--text);
      padding: 4px;
    }

    .mfe-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 99px;
      background: #EAF1EF;
      color: var(--sage-dark);
      margin-bottom: 10px;
    }

    .cam-box {
      width: 100%;
      height: 195px;
      border-radius: 14px;
      background: #0F172A;
      border: 2px solid var(--border);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 12px;
    }

    .cam-box img,
    .cam-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder {
      color: #94A3B8;
      font-size: 13px;
      text-align: center;
      padding: 14px;
      font-weight: 600;
    }

    .cam-pill {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.68);
      color: #FFF;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 800;
    }

    .metric-card {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      margin-bottom: 10px;
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: #FFF;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--sage);
      transition: width 0.2s;
    }

    .btn-media {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 11px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      background: var(--sage);
      color: #FFF;
    }

    .btn-media:hover {
      background: var(--sage-dark);
    }
  </style>
</head>

<body>
  <span class="mfe-badge">MFE-2 • Cámara & Micrófono (IA / Audio)</span>

  <div class="cam-box">
    <img id="camSnapshot" alt="Cámara Módulo Local" />
    <video id="webVideo" autoplay muted playsinline></video>
    <div id="camPlaceholder" class="placeholder">
      Esperando stream de <b>run_local.py</b> o activa la cámara web abajo.
    </div>
    <span id="camBadge" class="cam-pill">ATENCIÓN: --%</span>
  </div>

  <div class="metric-card">
    <div class="row-top">
      <span>👁️ Nivel de Atención Visual</span>
      <span id="attVal" style="color: var(--sage-dark);">-- %</span>
    </div>
    <div class="bar-bg">
      <div id="attBar" class="bar-fill"></div>
    </div>
  </div>

  <div class="metric-card">
    <div class="row-top">
      <span>🎤 Ruido Ambiental (Micrófono)</span>
      <span id="dbVal" style="color: var(--sage-dark);">-- dB</span>
    </div>
    <div class="bar-bg">
      <div id="dbBar" class="bar-fill"></div>
    </div>
    <div id="noiseMsg" style="font-size: 11.5px; color: var(--text-sec); font-weight: 700; margin-top: 5px;">
      Límite de concentración: 65 dB
    </div>
  </div>

  <button class="btn-media" onclick="enableBrowserMedia()">
    📷 Activar Cámara y Micrófono del Navegador
  </button>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let apiBase = (params.get('api') || 'https://focuslock-server-q3bw.onrender.com').replace(/\/+$/, '');
    let browserActive = false;
    let faceModel = null;

    function updateTelemetry(tel) {
      if (!tel) return;
      if (tel.attention_score !== undefined) {
        const pct = Math.round(tel.attention_score * 100);
        document.getElementById('attVal').textContent = `${pct}% ${tel.distraction_detected ? '⚠️ Distraído' : '✅ Enfocado'}`;
        document.getElementById('attBar').style.width = `${pct}%`;
        document.getElementById('attBar').style.background = tel.distraction_detected ? '#D96B4F' : '#489468';
        document.getElementById('camBadge').textContent = `ATENCIÓN: ${pct}%`;
      }
      if (tel.snapshot_base64 && !browserActive) {
        const img = document.getElementById('camSnapshot');
        img.src = tel.snapshot_base64;
        img.style.display = 'block';
        document.getElementById('camPlaceholder').style.display = 'none';
      }
      if (tel.decibels !== undefined) {
        document.getElementById('dbVal').textContent = `${tel.decibels} dB`;
        const w = Math.min(100, Math.max(0, tel.decibels));
        const bar = document.getElementById('dbBar');
        bar.style.width = `${w}%`;
        const msg = document.getElementById('noiseMsg');
        if (tel.noise_violation) {
          bar.style.background = '#DC2626';
          msg.textContent = '⚠️ ¡ALERTA! Ruido superó los 65 dB';
          msg.style.color = '#DC2626';
        } else {
          bar.style.background = 'var(--sage)';
          msg.textContent = '✅ Entorno silencioso (< 65 dB)';
          msg.style.color = 'var(--text-sec)';
        }
      }
    }

    async function enableBrowserMedia() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        browserActive = true;
        const video = document.getElementById('webVideo');
        video.srcObject = stream;
        video.style.display = 'block';
        document.getElementById('camSnapshot').style.display = 'none';
        document.getElementById('camPlaceholder').style.display = 'none';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        const src = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);
        const timeData = new Float32Array(analyser.fftSize);

        // Cargar modelo BlazeFace (TensorFlow.js) para detectar rostro y orientación real
        if (window.blazeface && !faceModel) {
          document.getElementById('camBadge').textContent = 'CARGANDO IA...';
          try { faceModel = await blazeface.load(); } catch (e) { faceModel = null; }
        }

        // Canvas oculto para analizar presencia si el modelo aún carga o falla
        const offCanvas = document.createElement('canvas');
        offCanvas.width = 160; offCanvas.height = 120;
        const offCtx = offCanvas.getContext('2d');

        let lastServerSync = 0;
        setInterval(async () => {
          if (audioCtx.state === 'suspended') {
            try { await audioCtx.resume(); } catch (e) {}
          }
          analyser.getFloatTimeDomainData(timeData);
          let sumSq = 0;
          for (let i = 0; i < timeData.length; i++) {
            sumSq += timeData[i] * timeData[i];
          }
          const rms = Math.sqrt(sumSq / timeData.length);
          let db = rms > 0.0002 ? Math.round(20 * Math.log10(rms) + 98) : 30;
          db = Math.max(30, Math.min(105, db));

          let attention = 0.25;
          let faceDetected = false;

          if (faceModel && video.readyState >= 2) {
            try {
              const preds = await faceModel.estimateFaces(video, false);
              if (preds && preds.length > 0) {
                faceDetected = true;
                const p = preds[0];
                const [x1, y1] = p.topLeft;
                const [x2, y2] = p.bottomRight;
                const cx = (x1 + x2) / 2;
                const vw = video.videoWidth || 640;
                const centerOffset = Math.abs(cx - vw / 2) / (vw / 2); // 0 = centrado, 1 = borde

                // Verificar simetría de ojos/nariz para detectar si miró hacia un lado
                let headTurnPenalty = 0;
                if (p.landmarks && p.landmarks.length >= 3) {
                  const rightEyeX = p.landmarks[0][0];
                  const leftEyeX = p.landmarks[1][0];
                  const noseX = p.landmarks[2][0];
                  const eyeMid = (rightEyeX + leftEyeX) / 2;
                  const eyeDist = Math.max(10, Math.abs(leftEyeX - rightEyeX));
                  const yawRatio = Math.abs(noseX - eyeMid) / eyeDist;
                  if (yawRatio > 0.35) headTurnPenalty = Math.min(0.45, (yawRatio - 0.35) * 0.9);
                }

                attention = Math.max(0.35, Math.min(0.98, 0.96 - centerOffset * 0.35 - headTurnPenalty));
              } else {
                faceDetected = false;
                attention = 0.18; // No aparece nadie frente a la cámara
              }
            } catch (e) {}
          } else if (video.readyState >= 2) {
            // Fallback por si no carga TFJS: detectar cambios en el centro del cuadro
            offCtx.drawImage(video, 0, 0, 160, 120);
            const imgData = offCtx.getImageData(40, 20, 80, 80).data;
            let skinPixels = 0;
            for (let i = 0; i < imgData.length; i += 4) {
              const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
              if (r > 95 && g > 40 && b > 20 && r > g && r > b && Math.abs(r - g) > 15) skinPixels++;
            }
            const ratio = skinPixels / (80 * 80);
            faceDetected = ratio > 0.06;
            attention = faceDetected ? Math.min(0.95, 0.65 + ratio * 1.2) : 0.20;
          }

          const distracted = !faceDetected || attention < 0.62;
          const payload = {
            attention_score: Number(attention.toFixed(2)),
            face_detected: faceDetected,
            distraction_detected: distracted,
            decibels: db,
            noise_violation: db > 65
          };
          updateTelemetry(payload);
          const now = Date.now();
          if (now - lastServerSync >= 1200) {
            lastServerSync = now;
            try {
              await fetch(apiBase + '/api/telemetry/report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
            } catch (e) { }
          }
        }, 300);
      } catch (err) {
        alert('Permiso de cámara/micrófono requerido (funciona en HTTPS o localhost): ' + err.message);
      }
    }

    window.addEventListener('message', (ev) => {
      const msg = ev.data || {};
      if (msg.type === 'set_api' && msg.apiBase) apiBase = msg.apiBase;
      if (msg.type === 'local_telemetry' && msg.data) updateTelemetry(msg.data);
    });
  </script>
</body>

</html>
