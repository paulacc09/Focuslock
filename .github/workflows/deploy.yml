name: CI/CD Pipeline - FocusLock Cloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==============================================================================
  # ETAPA 1: VALIDACIÓN, LINTING Y PRUEBAS AUTOMATIZADAS
  # ==============================================================================
  test-and-build:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias del Servidor
        run: |
          python -m pip install --upgrade pip
          pip install -r focuslock_server/requirements.txt

      - name: Validar Sintaxis e Integridad de Código
        run: |
          python -m py_compile focuslock_server/main.py
          python -m py_compile focuslock_server/fsm.py
          python -m py_compile focuslock_server/hardware.py
          python -m py_compile focuslock_server/database/postgres.py
          python -m py_compile focuslock_server/database/redis_store.py
          python -m py_compile local-module/main.py

      - name: Probar Inicialización de Bases de Datos (Fallback Local)
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'focuslock_server')
          from database import init_postgres, init_redis, get_recent_sessions
          init_postgres()
          init_redis()
          sessions = get_recent_sessions()
          print(f'Prueba de base de datos exitosa. Sesiones encontradas: {len(sessions)}')
          "

      - name: Validar Construcción del Contenedor Docker
        run: |
          docker build -t focuslock-server:latest -f Dockerfile .

  # ==============================================================================
  # ETAPA 2: DESPLIEGUE CONTINUO EN LA NUBE
  # ==============================================================================
  deploy-cloud:
    name: Despliegue en la Nube
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Disparar Despliegue en Render Cloud
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Notificando a Render para iniciar nuevo despliegue..."
            curl -X POST "$RENDER_HOOK"
            echo "Despliegue disparado exitosamente."
          else
            echo "Aviso: RENDER_DEPLOY_HOOK_URL no configurado en Secrets. El despliegue automático por webhook se activará cuando se agregue el secreto."
          fi

      - name: Verificación de Estado del Dominio de Producción
        run: |
          echo "Verificando disponibilidad de red en https://digiproy.qd.je ..."
          curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://digiproy.qd.je || echo "Dominio pendiente de propagación DNS."
