services:
  # ==============================================================================
  # RENDER WEB SERVICE — FOCUSLOCK CLOUD SERVER
  # ==============================================================================
  - type: web
    name: focuslock-server
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: focuslock-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0

databases:
  # ==============================================================================
  # RENDER MANAGED POSTGRESQL (Base de Datos 1)
  # ==============================================================================
  - name: focuslock-postgres
    databaseName: focuslock_db
    user: focuslock_user
    plan: free
    region: oregon
